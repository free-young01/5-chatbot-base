<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ bot.name }} — 이야기</title>
    <link rel="stylesheet" href="{{ asset_url('assets/css/style.css') }}">
    <script src="{{ asset_url('assets/js/chatbot.js') }}" defer></script>
  </head>
  <body class="chat-page">
    <header class="story-header">
      <a class="wordmark" href="{{ url_for('index') }}">THE NEW VILLAGE <span>더뉴빌리지로 오세요</span></a>
      <button id="restart-btn" class="text-button" type="button">처음부터 시작</button>
    </header>
    <main class="story-layout" data-player-name="{{ username }}">
      <div id="scene-background" class="scene-background" role="img" aria-label="새집 배경"></div>
      <div class="scene-caption">
        <div class="eyebrow">YOU ARE HERE</div>
        <h1 id="location-title">새집</h1>
        <p id="scene-character">현재 대화 상대: 지미</p>
      </div>
      <div class="affinity-card">
        <span>마을 호감도</span>
        <output id="affinity-value" aria-label="마을 호감도">70 / 100</output>
      </div>
      <img id="character-portrait" class="character-portrait" alt="" hidden>
      <section class="conversation" aria-label="대화">
        <div class="conversation-heading">
          <div class="eyebrow">CONVERSATION</div><h2 id="character-title">대화 상대를 기다리는 중</h2>
        </div>
        <div id="chat-log" class="chat-log" role="log" aria-live="off" aria-label="현재 장면과 인물의 대화 기록"></div>
        <p id="status-message" class="status-message" role="status"></p>
        <form id="chat-form" class="chat-input-area">
          <label class="visually-hidden" for="user-message">대화 입력</label>
          <input id="user-message" type="text" maxlength="2000" placeholder="이웃에게 말을 걸어 보세요" autocomplete="off" required disabled>
          <button id="send-btn" class="send-button" type="submit" disabled>보내기</button>
        </form>
      </section>
      <details class="journal">
        <summary>나의 생각과 단서</summary>
        <p class="journal-intro">대화와 조사를 통해 알게 된 사실이 여기에 기록됩니다.</p>
        <ul id="journal-list"></ul>
        <div id="ending-card" class="ending-card" hidden></div>
      </details>
      <nav class="story-actions" aria-label="할 수 있는 일">
        <div id="action-list" class="action-list"></div>
      </nav>
    </main>
  </body>
</html>
