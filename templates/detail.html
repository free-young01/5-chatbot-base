<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ bot.name }} - 소개</title>
    <link rel="stylesheet" href="{{ asset_url('assets/css/style.css') }}">
  </head>
  <body class="detail-page">
    <main class="modal-container">
      <header class="modal-header">
        <h1>{{ bot.name }}</h1>
        <a class="close-button" href="{{ url_for('index') }}" aria-label="처음으로 돌아가기">&times;</a>
      </header>
      <div class="modal-content">
        <img class="bot-image" src="{{ bot.image }}" alt="더뉴빌리지 소개 이미지">
        <p class="bot-description">{{ bot.description }}</p>
        {% if bot.tags %}
        <ul class="tags" aria-label="캐릭터 태그">
          {% for tag in bot.tags %}<li>{{ tag }}</li>{% endfor %}
        </ul>
        {% endif %}
        <form class="start-form" action="{{ url_for('chat') }}" method="get">
          <div class="username-area">
            <label for="username">이름:</label>
            <input id="username" name="username" type="text" maxlength="50" placeholder="당신의 이름" autocomplete="nickname" required>
          </div>
          <button class="start-chat" type="submit">이웃 만나기</button>
        </form>
      </div>
    </main>
  </body>
</html>
