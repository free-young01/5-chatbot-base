services:
  - type: web
    name: new-village-story-demo
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 app:app
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: STORY_STATE_KEY
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_REASONING_EFFORT
        value: none
